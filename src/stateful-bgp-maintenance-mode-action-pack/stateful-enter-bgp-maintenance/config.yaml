type: ACTION
name: Enter Stateful BGP Maintenance Mode
description: Enter BGP maintenance mode and record the pre-maintenance BGP peer baseline
language: PYTHON_3
action-type: CHANGECONTROL_CUSTOM
file: script.py
dynamic-params:
- name: DeviceID
  description: ID of the device on which to run the action
  required: true
  hidden: false
  default: ""
- name: MaintenanceEntryTimeoutSeconds
  description: Maximum seconds to wait for System to finish entering maintenance mode
  required: false
  hidden: false
  default: "300"
